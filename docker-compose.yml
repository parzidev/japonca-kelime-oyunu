services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: adakelime
    expose:
      - "5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      - VIRTUAL_HOST=kelime.parzi.dev
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - nginx-proxy-manager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  nginx-proxy-manager:
    external: true 