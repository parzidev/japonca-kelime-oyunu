<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <title>Ada bebek japonca bulmacası</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3" />
</head>

<body>
  <!-- Hidden SVG for filters -->
  <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
    <defs>
      <filter id="pencil-texture" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="game-wrapper">
    <header class="top-bar">
      <div class="timer">
        ⏱ <span id="timer">03:00</span>
      </div>
      <div class="score">
        Skor: <span id="score">0</span>
      </div>
      <button id="newGameBtn">🎀 Yeni Oyun 🎀</button>
    </header>

    <main class="main-layout">
      <section class="grid-container">
        <div id="grid" class="grid"></div>
        <svg id="grid-overlay" class="grid-overlay"></svg>
      </section>
      <section class="side-panel">
        <h2>Kelime Listesi <button id="toggleHintsBtn" class="hint-btn" title="Göster/Gizle">👁️</button></h2>
        <ul id="wordList" class="word-list"></ul>
        <div class="legend">
          <p><strong>Kana</strong> – Japonca yazım</p>
          <p><strong>Romaji</strong> – Latin harfleriyle okunuş</p>
          <p><strong>TR</strong> – Türkçe anlam</p>
        </div>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/game.js') }}?v=5"></script>
</body>

</html>
